[project]
name = "flag-generator"
version = "6.7"
description = "Flag generator!"
requires-python = ">=3.10"
dependencies = ["pygame"]

[project.scripts]
flag-generator = "flag_generator:main"
flag-generator-beta = "flag_generator:beta"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
